<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Chrome New Tab icon, dark theme</title>
  <!-- Crisp, muted-silver geometry matched to the ChromeOS dark-tab reference.
       Everything outside the circular mark remains transparent. -->
  <mask id="shutter" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="white"/>
    <path d="M12.8 12.8 22.7 37M32 21.5H59M36.8 41.2 22.6 59" fill="none" stroke="black" stroke-width="1.7" stroke-linecap="round"/>
  </mask>
  <circle cx="32" cy="32" r="28" fill="#b7bdc6" mask="url(#shutter)"/>
  <circle cx="32" cy="32" r="10.1" fill="#626b78" stroke="#b7bdc6" stroke-width="2"/>
</svg>
